services:
  - type: web
    name: concord
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ATTESTATION_SECRET
        generateValue: true
      - key: REID_LLM_ENABLED
        value: "false"
