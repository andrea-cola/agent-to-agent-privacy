<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concord — Judge Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --green: #3fb950;
            --red: #f85149;
            --orange: #d29922;
            --text: #c9d1d9;
            --dim: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 32px 24px;
        }
        .container { max-width: 820px; margin: 0 auto; }
        h1 {
            color: var(--green);
            font-size: 1.4em;
            margin-bottom: 4px;
        }
        .subtitle { color: var(--dim); font-size: 0.85em; margin-bottom: 28px; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }
        .status-bar .badge {
            font-size: 1.1em;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 4px;
        }
        .badge.pass { background: var(--green); color: var(--bg); }
        .badge.fail { background: var(--red); color: #fff; }
        .badge.pending { background: var(--border); color: var(--dim); }

        .run-btn {
            background: var(--orange);
            color: var(--bg);
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.9em;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .run-btn:hover { opacity: 0.85; }
        .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .url-input {
            display: flex; gap: 8px;
            margin-bottom: 24px;
        }
        .url-input input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.85em;
            padding: 8px 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        th {
            text-align: left;
            padding: 10px 14px;
            background: var(--bg);
            color: var(--green);
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        td {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            font-size: 0.85em;
        }
        .step-pass { color: var(--green); font-weight: 700; }
        .step-fail { color: var(--red); font-weight: 700; }

        h2 {
            color: var(--orange);
            font-size: 1em;
            margin-bottom: 12px;
        }
        .decisions-table td:first-child { font-weight: 700; }
        .action-SHARE { color: var(--green); }
        .action-MASK { color: var(--orange); }
        .action-REJECT { color: var(--red); }

        .risk-row {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
        }
        .risk-card {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
        }
        .risk-card .label { color: var(--dim); font-size: 0.75em; text-transform: uppercase; }
        .risk-card .value { font-size: 2em; font-weight: 700; margin: 4px 0; }
        .risk-low { color: var(--green); }
        .risk-elevated { color: var(--orange); }
        .risk-high { color: var(--red); }

        .log {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            font-size: 0.8em;
            color: var(--green);
            max-height: 240px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>CONCORD</h1>
    <p class="subtitle">Agent Privacy Handshake — Judge Test</p>

    <div class="url-input">
        <input type="text" id="base-url" value="https://YOUR_RENDER_URL" placeholder="Base URL">
        <button class="run-btn" id="run-btn" onclick="runJudgeTest()">Run Judge Test</button>
    </div>

    <div class="status-bar">
        <span>Overall</span>
        <span class="badge pending" id="overall-badge">PENDING</span>
    </div>

    <table id="steps-table">
        <thead><tr><th>Step</th><th>Description</th><th>Status</th><th>Detail</th></tr></thead>
        <tbody id="steps-body"></tbody>
    </table>

    <div class="risk-row" id="risk-row" style="display:none;">
        <div class="risk-card"><div class="label">Inbound Risk</div><div class="value" id="risk-in">—</div></div>
        <div class="risk-card"><div class="label">Residual Risk</div><div class="value" id="risk-out">—</div></div>
        <div class="risk-card"><div class="label">Verdict</div><div class="value" id="verdict-val" style="font-size:1em;">—</div></div>
    </div>

    <h2>Decisions Trace</h2>
    <table class="decisions-table">
        <thead><tr><th>Category</th><th>Action</th><th>Token</th><th>Reason</th></tr></thead>
        <tbody id="decisions-body"></tbody>
    </table>

    <div class="log" id="log-output"></div>
</div>

<script>
const STEPS = [
    {id:'A', desc:'Anonymous request rejected (422)'},
    {id:'B', desc:'Negotiation succeeds (200, verdict present)'},
    {id:'C', desc:'SECRET always rejected + absent from output'},
    {id:'D', desc:'Rehydrate restores tokens (200)'},
    {id:'E', desc:'Rehydrate by wrong agent rejected (403)'},
    {id:'F', desc:'Attestation is signed and retrievable'},
];

function log(msg) {
    const el = document.getElementById('log-output');
    el.style.display = 'block';
    el.textContent += msg + '\n';
    el.scrollTop = el.scrollHeight;
}

async function api(method, path, body) {
    const base = document.getElementById('base-url').value.replace(/\/+$/,'');
    const opts = {method, headers:{'Content-Type':'application/json'}};
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(base + path, opts);
    let data = null;
    try { data = await r.json(); } catch(e) {}
    return {status: r.status, data};
}

function setStep(id, passed, detail) {
    const tbody = document.getElementById('steps-body');
    let row = document.getElementById('step-'+id);
    if (!row) {
        row = document.createElement('tr');
        row.id = 'step-'+id;
        const s = STEPS.find(s=>s.id===id);
        row.innerHTML = `<td>${id}</td><td>${s?s.desc:''}</td><td></td><td></td>`;
        tbody.appendChild(row);
    }
    row.cells[2].innerHTML = passed
        ? '<span class="step-pass">PASS</span>'
        : '<span class="step-fail">FAIL</span>';
    row.cells[3].textContent = detail||'';
}

function riskClass(v) { return v<=32?'risk-low':v<=65?'risk-elevated':'risk-high'; }

async function runJudgeTest() {
    const btn = document.getElementById('run-btn');
    btn.disabled = true; btn.textContent = 'Running...';
    document.getElementById('steps-body').innerHTML = '';
    document.getElementById('decisions-body').innerHTML = '';
    document.getElementById('log-output').textContent = '';
    document.getElementById('risk-row').style.display = 'none';
    const badge = document.getElementById('overall-badge');
    badge.className = 'badge pending'; badge.textContent = 'RUNNING...';

    let passed = 0;
    const results = {};

    try {
        // A
        log('A: POST /v1/negotiate (no sender_profile)');
        const rA = await api('POST','/v1/negotiate',{recipient_profile:'analytics-agent-07',persona:'gdpr_safe',payload:'test'});
        const pA = rA.status === 422;
        setStep('A', pA, `status=${rA.status}`);
        if (pA) passed++;

        // B
        const payload = 'Customer Mario Rossi (mario.rossi@example.it) lives in Milano. IBAN IT60X0542811101000000123456. Diagnosis: diabetes. API key: sk-live-abc123xyz456789.';
        log('B: POST /v1/negotiate (full payload)');
        const rB = await api('POST','/v1/negotiate',{sender_profile:'finance-agent-01',recipient_profile:'analytics-agent-07',persona:'gdpr_safe',payload});
        const pB = rB.status === 200 && rB.data && rB.data.verdict;
        setStep('B', pB, `status=${rB.status}, verdict=${rB.data?.verdict||'N/A'}`);
        if (pB) passed++;
        const data = rB.data || {};

        // C
        const secs = (data.decisions||[]).filter(d=>d.category==='SECRET');
        const allRej = secs.length>0 && secs.every(d=>d.action==='REJECT');
        const noLeak = !(data.outbound_payload||'').includes('sk-live');
        const pC = allRej && noLeak;
        setStep('C', pC, `rejected=${secs.length}, leaked=${!noLeak}`);
        if (pC) passed++;

        // D
        log('D: POST /v1/rehydrate (sender)');
        const rD = await api('POST','/v1/rehydrate',{transfer_id:data.transfer_id,text:data.outbound_payload,agent_id:'finance-agent-01'});
        const pD = rD.status===200 && (rD.data?.text||'').includes('mario.rossi@example.it');
        setStep('D', pD, `status=${rD.status}`);
        if (pD) passed++;

        // E
        log('E: POST /v1/rehydrate (wrong agent)');
        const rE = await api('POST','/v1/rehydrate',{transfer_id:data.transfer_id,text:data.outbound_payload,agent_id:'imposter-agent'});
        const pE = rE.status===403;
        setStep('E', pE, `status=${rE.status}`);
        if (pE) passed++;

        // F
        log('F: GET /v1/attestation/{transfer_id}');
        const rF = await api('GET',`/v1/attestation/${data.transfer_id}`);
        const pF = rF.status===200 && rF.data?.signed===true && !!rF.data?.sig;
        setStep('F', pF, `signed=${rF.data?.signed}, alg=${rF.data?.alg||'N/A'}`);
        if (pF) passed++;

        // Decisions table
        const dtbody = document.getElementById('decisions-body');
        for (const d of data.decisions||[]) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${d.category}</td><td class="action-${d.action}">${d.action}</td><td>${d.token||'—'}</td><td>${d.reason}</td>`;
            dtbody.appendChild(tr);
        }

        // Risk
        if (data.inbound_risk != null) {
            document.getElementById('risk-row').style.display = 'flex';
            const riEl = document.getElementById('risk-in');
            riEl.textContent = data.inbound_risk;
            riEl.className = 'value ' + riskClass(data.inbound_risk);
            const roEl = document.getElementById('risk-out');
            roEl.textContent = data.residual_risk;
            roEl.className = 'value ' + riskClass(data.residual_risk);
            document.getElementById('verdict-val').textContent = data.verdict;
        }

    } catch(e) {
        log('ERROR: ' + e.message);
    }

    badge.textContent = passed===6?'ALL PASSED':`${passed}/6 PASSED`;
    badge.className = 'badge ' + (passed===6?'pass':'fail');
    log(`\n${passed}/6 steps passed`);
    btn.disabled = false; btn.textContent = 'Run Judge Test';
}
</script>
</body>
</html>
